<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>踪语AI - 注册</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="register-card">
        <h2>🌿 踪语AI</h2>
        <p class="subtitle">开启你的心灵疗愈之旅</p>
        <form id="registerForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="confirmPassword" placeholder="请再次输入密码" required>
            </div>
            <button type="submit" class="btn-register">注 册</button>
            <div class="msg" id="msgBox"></div>
        </form>
        <div class="switch-link">
            已有账号？<a href="index.html">返回登录</a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol === 'https:' ? '/api' : 'http://' + window.location.hostname + ':8000/api';
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgBox = document.getElementById('msgBox');
            msgBox.className = 'msg';
            msgBox.textContent = '';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            try {
                const res = await fetch(`${API_BASE}/user_app/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, confirm_password: confirmPassword })
                });
                const data = await res.json();

                if (res.ok && data.code === 200) {
                    msgBox.className = 'msg success';
                    msgBox.textContent = '注册成功，即将跳转登录...';
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    msgBox.className = 'msg error';
                    msgBox.textContent = data.msg || '注册失败';
                }
            } catch (err) {
                msgBox.className = 'msg error';
                msgBox.textContent = '网络异常，请检查后端服务';
            }
        });
    </script>
</body>
</html>
