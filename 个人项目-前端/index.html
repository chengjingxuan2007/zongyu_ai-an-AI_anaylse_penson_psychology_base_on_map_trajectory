<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>踪语AI - 登录</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="login-card">
        <h2>🌿 踪语AI</h2>
        <p class="subtitle">记录情绪轨迹，温暖每一段旅程</p>

        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="switch-link">
            还没有账号？<a href="register.html">立即注册</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://10.199.166.126:8000/api';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/user_app/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.code === 200) {
                    // 存储Token到本地
                    localStorage.setItem('access_token', data.data.access);
                    localStorage.setItem('refresh_token', data.data.refresh);
                    localStorage.setItem('username', data.data.username);
                    // 跳转到主页面
                    window.location.href = 'main.html';
                } else {
                    errorMsg.textContent = data.msg || '登录失败,请检查用户名或密码';
                }
            } catch (err) {
                errorMsg.textContent = '网络异常，请检查后端服务是否启动';
            }
        });
    </script>
</body>
</html>
